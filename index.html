<style>

.opts{display:flex;flex-wrap:wrap;gap:9px}.qo{display:grid}.qo button,.opts button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:12px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;text-align:left}.qo{gap:10px}.qo button:hover,.opts button:hover{border-color:var(--ac)}

<script>
/* =====================================================================

   • Yeni konu  → TOPICS dizisinin SONUNA bir nesne ekle:
     {id:'benzersiz-id', s:'ders-id', week:HAFTA_NO, i:'emoji', title:'Konu', sub:'Kısa açıklama',
      cards:[{t:'Başlık', b:'HTML anlatım', e:['örnek',...], c:['soru',[şıklar],doğruIndex]}],
      q:[['Soru',[şıklar],doğruIndex,'Açıklama']],           // Test
      tf:[['İfade',true/false,'Açıklama']],                   // Doğru / Yanlış
      m:[['Terim','Açıklama']]}                               // Eşleştirme
   En yüksek "week" değerine sahip konular otomatik "YENİ" rozeti alır.
   ===================================================================== */
const SUBJECTS=[
{id:'mat',name:'Matematik',i:'🧮',c:'#8b76ed',b:'#f0ecff',d:'Çember, doğrular ve açılar.'},
{id:'en',name:'İngilizce',i:'🌍',c:'#4668ec',b:'#eaf0ff',d:'Soru sözcükleri, zamirler, am/is/are ve daha fazlası.'},
{id:'tr',name:'Türkçe',i:'📖',c:'#e0603f',b:'#fff0ec',d:'Yazım kuralları, noktalama ve sözcük bilgisi.'},
{id:'fen',name:'Fen Bilimleri',i:'🔭',c:'#2fa57a',b:'#ddf6ec',d:'Doğayı, uzayı ve çevremizi keşfet.'}];
/* Çizim yardımcıları (açı ve doğru şekilleri) */
const ang=(d,l)=>{const r=d*Math.PI/180,x=(60+60*Math.cos(r)).toFixed(0),y=(70-60*Math.sin(r)).toFixed(0);return `<figure style="margin:0;text-align:center"><svg viewBox="0 0 130 80" width="130"><line x1="60" y1="70" x2="120" y2="70" stroke="#4668ec" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="70" x2="${x}" y2="${y}" stroke="#ff8a73" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="70" r="4" fill="#162448"/></svg><figcaption style="font-weight:800;font-size:13px">${l}</figcaption></figure>`};
const angs=a=>`<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px">${a.map(x=>ang(x[0],x[1])).join('')}</div>`;
const ln=(k,l)=>{const L='<polygon points="4,20 14,14 14,26" fill="#4668ec"/>',R='<polygon points="156,20 146,14 146,26" fill="#4668ec"/>',d=k==='doğru'?L+R:k==='ışın'?R:'',c=k==='doğru'?'':`<circle cx="20" cy="20" r="5" fill="#ff8a73"/>${k==='parça'?'<circle cx="140" cy="20" r="5" fill="#ff8a73"/>':''}`;return `<figure style="margin:0;text-align:center"><svg viewBox="0 0 160 40" width="160"><line x1="10" y1="20" x2="150" y2="20" stroke="#4668ec" stroke-width="4"/>${d}${c}</svg><figcaption style="font-weight:800;font-size:13px">${l}</figcaption></figure>`};
const TOPICS=[
{id:'mat-cember',s:'mat',week:0,i:'⭕',title:'Çemberi Keşfedelim',sub:'Çember, daire, merkez, yarıçap, çap, pergel, merkez açısı',frame:'cember',cards:[],q:[],tf:[],m:[]},
{id:'mat-aci',s:'mat',week:2,i:'📐',title:'Doğrular ve Açılar',sub:'Doğru, doğru parçası, ışın ve açı çeşitleri',
cards:[{t:'Doğru, doğru parçası ve ışın',b:`<b>Doğru</b> iki yönde sonsuza uzanır, uç noktası yoktur. <b>Doğru parçası</b>nın iki uç noktası vardır ve uzunluğu ölçülebilir. <b>Işın</b>ın bir başlangıç noktası vardır, bir yönde sonsuza uzanır.<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px">${ln('doğru','Doğru')}${ln('parça','Doğru parçası')}${ln('ışın','Işın')}</div>`,e:['Doğru: uç noktası yok','Doğru parçası: 2 uç nokta','Işın: 1 başlangıç noktası'],c:['Bir başlangıç noktası olan ve tek yönde sonsuza giden çizgi hangisidir?',['Doğru','Işın','Doğru parçası'],1]},
{t:'Açı nedir?',b:'Başlangıç noktaları ortak olan iki ışının oluşturduğu şekle <b>açı</b> denir. Ortak noktaya <b>köşe</b>, ışınlara <b>kol</b> denir. Açılar <b>derece (°)</b> ile ölçülür.',e:['Köşe: ortak nokta','Kollar: iki ışın','Birim: derece (°)'],c:['Açının ortak başlangıç noktasına ne denir?',['Kol','Köşe','Derece'],1]},
{t:'Açı çeşitleri',b:`Açılar ölçülerine göre adlandırılır: <b>dar açı</b> 90°’den küçük, <b>dik açı</b> tam 90°, <b>geniş açı</b> 90°’den büyük ve 180°’den küçüktür.${angs([[45,'Dar açı (45°)'],[90,'Dik açı (90°)'],[135,'Geniş açı (135°)']])}`,e:['Dar < 90°','Dik = 90°','90° < Geniş < 180°'],c:['Ölçüsü 120° olan açı hangi çeşittir?',['Dar açı','Dik açı','Geniş açı'],2]}],
q:[['Ölçüsü 35° olan açı hangi çeşittir?',['Dar açı','Dik açı','Geniş açı'],0,'35°, 90°’den küçük olduğu için dar açıdır.'],['Dik açının ölçüsü kaç derecedir?',['45°','90°','180°'],1,'Dik açı tam 90°’dir.'],['İki uç noktası olan çizgi hangisidir?',['Doğru','Işın','Doğru parçası'],2,'Doğru parçasının iki uç noktası vardır.'],['Ölçüsü 150° olan açı hangi çeşittir?',['Geniş açı','Dar açı','Dik açı'],0,'150°, 90°’den büyük ve 180°’den küçüktür.']],
tf:[['Işının bir başlangıç noktası vardır.',true,'Doğru! Işın bir yönde sonsuza uzanır.'],['Dik açı 90°’dir.',true,'Doğru!'],['Geniş açı 90°’den küçüktür.',false,'Geniş açı 90°’den büyüktür.'],['Doğrunun iki uç noktası vardır.',false,'Doğrunun uç noktası yoktur; iki yönde sonsuza uzanır.']],
m:[['Dar açı','90°’den küçük'],['Dik açı','Tam 90°'],['Geniş açı','90° ile 180° arası'],['Işın','Bir başlangıç noktası var, sonsuza uzanır']]},
{id:'en-q',s:'en',week:1,i:'❓',title:'Soru Sözcükleri',sub:'What, Who, Which, Where, When, Why, How',
cards:[{t:'What, Who, Which',b:'<b>What</b> = ne, <b>Who</b> = kim, <b>Which</b> = hangi. Soru sözcüğü cümlenin başına gelir.',e:['What is your name?','Who is she?','Which color do you like?'],c:['“Kim?” sorusu hangisidir?',['What','Who','Which'],1]},
{t:'Where, When, Why, How',b:'<b>Where</b> = nerede, <b>When</b> = ne zaman, <b>Why</b> = neden, <b>How</b> = nasıl.',e:['Where is my bag?','When is your birthday?','Why are you happy?','How are you?'],c:['“Ne zaman?” için hangi sözcük kullanılır?',['Where','Why','When'],2]}],
q:[['“Where is the cat?” sorusu neyi sorar?',['Yeri','Zamanı','Kişiyi'],0,'Where = nerede, yer sorar.'],['___ is your teacher? (Öğretmenin kim?)',['What','Who','When'],1,'Kişi sorarken Who kullanılır.'],['___ do you like, tea or milk?',['Which','Where','Why'],0,'Seçenekler arasından seçerken Which (hangi) kullanılır.'],['“How are you?” sorusunun Türkçesi nedir?',['Neredesin?','Nasılsın?','Kimsin?'],1,'How = nasıl.']],
tf:[['When = nerede',false,'When “ne zaman” demektir. Nerede = Where.'],['Why = neden',true,'Doğru!'],['Soru sözcüğü genellikle cümlenin başına gelir.',true,'Evet: What, Where, Who…']],
m:[['What','ne'],['Where','nerede'],['When','ne zaman'],['Who','kim']]},
{id:'en-freq',s:'en',week:1,i:'🔁',title:'Sıklık Zarfları',sub:'always, usually, often, sometimes, never',
cards:[{t:'Ne sıklıkla?',b:'Bir işi ne kadar sık yaptığımızı anlatır: <b>always</b> (her zaman) › <b>usually</b> (genellikle) › <b>often</b> (sık sık) › <b>sometimes</b> (bazen) › <b>never</b> (asla).',e:['I always brush my teeth.','He often plays football.','We sometimes eat pizza.','They never walk to school.'],c:['“Bazen” hangisidir?',['often','sometimes','never'],1]},
{t:'Cümlede yeri',b:'Sıklık zarfı <b>fiilden önce</b> gelir. Ama <b>am / is / are</b>’dan <b>sonra</b> gelir.',e:['I usually get up early.','She is always happy.'],c:['Doğru cümle hangisi?',['She is never late.','She never is late.','Never she is late.'],0]}],
q:[['“How often do you read?” sorusuna hangisi cevap olur?',['Yes, I do.','I often read.','I am at home.'],1,'How often = ne sıklıkla; cevap sıklık zarfıdır.'],['En sık yapılan iş hangisini anlatır?',['never','sometimes','always'],2,'always = her zaman.'],['I ___ eat fish. (asla)',['always','never','often'],1,'never = asla.'],['Doğru cümle hangisi?',['He often plays.','Often he plays.','He plays often is.'],0,'Sıklık zarfı fiilden önce gelir.']],
tf:[['Sometimes = her zaman',false,'Sometimes = bazen. Her zaman = always.'],['Never = asla',true,'Doğru!'],['Sıklık zarfı am/is/are’dan önce gelir.',false,'am/is/are’dan sonra gelir: She is always happy.']],
m:[['always','her zaman'],['usually','genellikle'],['sometimes','bazen'],['never','asla']]},
{id:'en-pron',s:'en',week:1,i:'🙋',title:'Kişi Zamirleri',sub:'I, you, he, she, it, we, they',
cards:[{t:'Tekil zamirler',b:'<b>I</b> = ben, <b>you</b> = sen, <b>he</b> = o (erkek), <b>she</b> = o (kadın), <b>it</b> = o (eşya / hayvan).',e:['I am Ada.','He is my brother.','It is a cat.'],c:['Kız arkadaşın için hangisini kullanırsın?',['he','she','it'],1]},
{t:'Çoğul zamirler',b:'<b>we</b> = biz, <b>you</b> = siz, <b>they</b> = onlar.',e:['We are friends.','They are students.'],c:['“Onlar” hangisidir?',['we','they','you'],1]}],
q:[['Tom is my friend. ___ is funny.',['He','She','It'],0,'Tom erkek, o yüzden He.'],['“Ayşe and I” yerine hangisi kullanılır?',['They','We','You'],1,'Ben dahil → We.'],['“The dog” yerine hangisi kullanılır?',['He','They','It'],2,'Hayvan ve eşya için it.'],['“Ali and Can” yerine hangisi kullanılır?',['we','they','she'],1,'Onlar → they.']],
tf:[['She = o (erkek)',false,'She kadın için; erkek için he.'],['We = biz',true,'Doğru!'],['It insan için kullanılır.',false,'It eşya ve hayvan içindir.']],
m:[['I','ben'],['you','sen / siz'],['we','biz'],['they','onlar']]},
{id:'en-be',s:'en',week:1,i:'🟰',title:'am / is / are',sub:'“-dir, -dır, -im, -sin” anlamı veren yardımcı fiil',
cards:[{t:'Hangi zamirle hangisi?',b:'<b>I</b> → am. <b>He, she, it</b> → is. <b>You, we, they</b> → are.',e:['I am happy.','She is a doctor.','They are at school.'],c:['We ___ friends.',['am','is','are'],2]},
{t:'Olumsuz ve soru',b:'Olumsuz için sonuna <b>not</b> ekle: <i>He is not tired.</i> Soru için başa al: <i>Is she a teacher?</i>',e:['He is not tired.','Are you ready?'],c:['Soru cümlesi hangisi?',['Are you ready?','You are ready.','You ready are.'],0]}],
q:[['I ___ ten years old.',['is','am','are'],1,'I ile am kullanılır.'],['The cat ___ black.',['is','are','am'],0,'The cat = it → is.'],['They ___ in the garden.',['is','am','are'],2,'They ile are.'],['“She is not a nurse.” cümlesi nedir?',['Soru','Olumsuz','Olumlu'],1,'is not = olumsuz.']],
tf:[['I ile “is” kullanılır.',false,'I ile am kullanılır.'],['You ile are kullanılır.',true,'Doğru!'],['Soru yaparken am/is/are başa gelir.',true,'Is she…? Are you…?']],
m:[['am','I ile kullanılır'],['is','he, she, it ile kullanılır'],['are','you, we, they ile kullanılır'],['not','cümleyi olumsuz yapar']]},
{id:'en-art',s:'en',week:1,i:'🔤',title:'a / an / the',sub:'Tanımlıklar (articles)',

const $=id=>document.getElementById(id),sub=id=>SUBJECTS.find(x=>x.id===id),tp=id=>TOPICS.find(x=>x.id===id),maxW=Math.max(...TOPICS.map(t=>t.week));
const store={get(){try{return JSON.parse(localStorage.getItem('kesfedelim')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('kesfedelim',JSON.stringify(o))}catch(e){}}};
let P=Object.assign({pts:0,done:{}},store.get());
const S={v:'home',s:'',t:'',tab:'learn',ci:0,m:'test',i:0,sc:0,a:false,sel:-1,pl:{},mo:[]};
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
function add(n){P.pts+=n;$('pts').textContent=P.pts;store.set(P)}
function done(id){P.done[id]=1;store.set(P)}
function go(o){Object.assign(S,o);render();scrollTo({top:0})}

function navHTML(mob){const it=[['home','⌂','Ana Sayfa'],...SUBJECTS.map(s=>[s.id,s.i,s.name])];return it.map(([id,ic,n])=>`<button class="${(id==='home'?S.v==='home':S.s===id&&S.v!=='home')?'on':''}" onclick="${id==='home'?"go({v:'home',s:'',t:''})":`go({v:'sub',s:'${id}',t:''})`}">${mob?`<span>${ic}</span>${n.split(' ')[0]}`:`<span style="margin-right:10px">${ic}</span>${n}`}</button>`).join('')}
function topicCard(t){const d=P.done[t.id];return `<div class="card" onclick="openTopic('${t.id}')">${t.week===maxW?'<span class="badge">YENİ</span>':''}<div class="ic">${t.i}</div><h3>${t.title}</h3><p>${t.sub}</p><small>${t.frame?'Etkileşimli ders':d?'✓ Tamamlandı':'Hafta '+t.week}</small></div>`}
function home(){return `<div class="hero"><div><h1>Haydi<br>Keşfedelim!</h1><p>Dersini seç, konunu seç; öğren ve pekiştir.</p></div><div class="hart">✦</div></div><h2 class="sh">Derslerin</h2><div class="grid">${SUBJECTS.map(s=>{const ts=TOPICS.filter(t=>t.s===s.id),d=ts.filter(t=>P.done[t.id]).length;return `<div class="card" style="--ac:${s.c};--ac2:${s.b}" onclick="go({v:'sub',s:'${s.id}'})"><div class="ic">${s.i}</div><h3>${s.name}</h3><p>${s.d}</p><small>${d} / ${ts.length} konu tamamlandı</small></div>`}).join('')}</div><h2 class="sh">Son eklenen konular<small>Her hafta yeni konular eklenecek.</small></h2><div class="grid">${TOPICS.filter(t=>t.week===maxW).slice(0,4).map(t=>{const s=sub(t.s);return `<div style="display:contents;--ac:${s.c};--ac2:${s.b}">${topicCard(t)}</div>`}).join('')}</div>`}
function frameView(t){return `<div class="tt"><h1>${t.i} ${t.title}</h1><p>${t.sub}</p></div><iframe class="fr" id="fr" title="${t.title}"></iframe>`}

function topicView(t){return `<div class="tt"><h1>${t.i} ${t.title}</h1><p>${t.sub}</p></div><div class="tabs"><button class="${S.tab==='learn'?'on':''}" onclick="go({tab:'learn',ci:0})">📚 Konu Anlatımı</button><button class="${S.tab==='prac'?'on':''}" onclick="setMode('test')">🎯 Pekiştir</button></div>${S.tab==='learn'?learn(t):prac(t)}`}
function learn(t){const c=t.cards[S.ci],n=t.cards.length,last=S.ci===n-1;return `<div class="bar"><i style="width:${(S.ci+1)/n*100}%"></i></div><article class="lc"><h2>${c.t}</h2><div class="b">${c.b}</div><div class="ex">${c.e.map(x=>`<span>${x}</span>`).join('')}</div><div class="chk"><h3>Hemen dene: ${c.c[0]}</h3><div class="opts">${c.c[1].map((o,i)=>`<button onclick="chk(this,${i===c.c[2]})">${o}</button>`).join('')}</div><div class="fb" id="cfb"></div></div></article><div class="nv"><button class="btn" ${S.ci?'':'disabled'} onclick="go({ci:S.ci-1})">← Önceki</button><span>${S.ci+1} / ${n}</span><button class="btn p" onclick="${last?"setMode('test')":'go({ci:S.ci+1})'}">${last?'Pekiştirmeye geç →':'Sonraki →'}</button></div>`}
function chk(b,ok){const f=$('cfb');if(b.classList.contains('ok'))return;f.textContent=ok?'🎉 Doğru! Harika!':'Bir daha düşün, tekrar deneyebilirsin.';f.className='fb '+(ok?'good':'try');b.classList.add(ok?'ok':'no');if(ok)add(1)}
const names={test:'📝 Test',tf:'✅ Doğru / Yanlış',match:'🧲 Eşleştir'};
function list(t){return S.m==='tf'?t.tf.map(x=>[x[0],['✅ Doğru','❌ Yanlış'],x[1]?0:1,x[2]]):t.q}
function prac(t){const tabs=`<div class="tabs">${Object.entries(names).map(([k,v])=>`<button class="${S.m===k?'on':''}" onclick="setMode('${k}')">${v}</button>`).join('')}</div>`;return tabs+(S.m==='match'?match(t):quiz(t))}
function finish(t,sc,n,msg){const p=Math.round(sc/n*100);if(p>=60)done(t.id);return `<div class="rb"><div class="st">${p>=75?'🏆':'🌟'}</div><h2>${p>=75?'Harika iş çıkardın!':'Güzel bir başlangıç!'}</h2><p>${msg||`${n} sorudan ${sc} tanesini doğru yaptın (%${p}).`}</p><button class="btn p" onclick="setMode('${S.m}')">🔁 Tekrar dene</button><button class="btn" onclick="go({tab:'learn',ci:0})">📚 Konuya dön</button><button class="btn" onclick="go({v:'sub',t:''})">Diğer konular</button></div>`}
function quiz(t){const L=list(t);if(S.i>=L.length)return finish(t,S.sc,L.length);const q=L[S.i];return `<div class="bar"><i style="width:${S.i/L.length*100}%"></i></div><div class="qc"><div class="qi">Soru ${S.i+1} / ${L.length} • ⭐ ${S.sc} doğru</div><h2>${q[0]}</h2><div class="qo">${q[1].map((o,i)=>`<button onclick="ans(${i},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="fb" id="qfb"></div><div class="nv"><span></span><button class="btn p" id="qn" style="display:none" onclick="go({i:S.i+1,a:false})">${S.i===L.length-1?'Sonucu gör →':'Sonraki →'}</button></div></div>`}
function ans(i,b){if(S.a)return;S.a=true;const q=list(tp(S.t))[S.i],bs=document.querySelectorAll('.qo button'),f=$('qfb');bs[q[2]].classList.add('ok');if(i===q[2]){S.sc++;add(2);f.textContent='🎉 '+q[3];f.className='fb good'}else{b.classList.add('no');f.textContent='Canın sağ olsun! '+q[3];f.className='fb try'}$('qn').style.display='inline-block'}
function match(t){const n=t.m.length;if(Object.keys(S.pl).length===n)return finish(t,n,n,'Bütün eşleştirmeleri doğru yaptın!');return `<div class="qc"><h2>Terimi doğru açıklamayla eşleştir</h2><p style="color:var(--muted);font-size:13px;margin-top:-10px">Önce bir terime, sonra uygun açıklamaya dokun.</p><div class="mg"><div>${t.m.map((x,i)=>`<button class="tile ${S.pl[i]?'pl':''} ${S.sel===i?'sel':''}" onclick="pick(${i})">${x[0]}</button>`).join('')}</div><div>${S.mo.map(j=>`<button class="zone" onclick="drop(${j})">${t.m[j][1]}${S.pl[j]?`<b>✓ ${t.m[j][0]}</b>`:''}</button>`).join('')}</div></div></div>`}
function pick(i){if(!S.pl[i])go({sel:i})}
function drop(j){if(S.sel<0||S.pl[j])return;if(S.sel===j){S.pl[j]=1;add(2);toast('🎉 Harika eşleştirme!')}else toast('Bir daha düşün!');S.sel=-1;render()}
function render(){const s=sub(S.s),t=tp(S.t),a=$('app');a.style.setProperty('--ac',s?s.c:'#4668ec');a.style.setProperty('--ac2',s?s.b:'#eaf0ff');a.style.animation='none';a.offsetWidth;a.style.animation='';

$('nav').innerHTML=navHTML(false);$('mnav').innerHTML=navHTML(true);$('pts').textContent=P.pts;
a.innerHTML=S.v==='home'?home():S.v==='sub'?subView(s):S.v==='frame'?frameView(t):topicView(t);if(S.v==='frame')$('fr').srcdoc=FRAMES[t.frame]}
render();
</script>

ctive-prompt\"><h3>Hangisi çaptır?<\/h3><div class=\"option-row\"><button class=\"option\" onclick=\"miniChoice(this,false,'diamFb')\">A) Merkezden çembere<\/button><button class=\"option\" onclick=\"miniChoice(this,false,'diamFb')\">B) Çemberden çembere ama merkezden geçmiyor<\/button><button class=\"option\" onclick=\"miniChoice(this,true,'diamFb')\">C) Çemberden çembere ve merkezden geçiyor<\/button><\/div><div class=\"feedback\" id=\"diamFb\"><\/div><\/div>`;\nif(l.kind==='drag')body=`<div class=\"demo-grid\"><div class=\"diagram sim-wrap\"><svg class=\"sim-svg\" id=\"dragSvg\" viewBox=\"0 0 300 230\"><circle cx=\"150\" cy=\"115\" r=\"83\" fill=\"white\" stroke=\"#4668ec\" stroke-width=\"5\"/><line id=\"dragLine\" x1=\"82\" y1=\"67\" x2=\"218\" y2=\"163\" stroke=\"#ff8a73\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle id=\"handle1\" cx=\"82\" cy=\"67\" r=\"10\" fill=\"#ff8a73\"/><circle id=\"handle2\" cx=\"218\" cy=\"163\" r=\"10\" fill=\"#ff8a73\"/><circle cx=\"150\" cy=\"115\" r=\"6\" fill=\"#25304b\"/><text x=\"157\" y=\"111\" font-size=\"15\" font-weight=\"800\">O<\/text><\/svg><div class=\"drag-tip\">Uç noktaları sürükle ✋<\/div><\/div><div><div class=\"diagram-note\" id=\"dragNote\">Uç noktalar çemberin üzerinde olsun. Çizgiyi merkezden geçirmeyi dene.<\/div><p style=\"font-size:13px;color:var(--muted);line-height:1.6\">Çemberin iki noktasını birleştiren her doğru parçası çap değildir. Merkezden geçmesi gerekir.<\/p><button class=\"btn secondary\" onclick=\"resetDrag()\">↻ Yeniden başla<\/button><\/div><\/div>`;\nif(l.kind==='relation')body=`<div class=\"demo-grid\"><div class=\"diagram\"><svg viewBox=\"0 0 300 230\"><circle cx=\"150\" cy=\"115\" r=\"75\" fill=\"#f5f6ff\" stroke=\"#4668ec\" stroke-width=\"5\"/><line x1=\"75\" y1=\"115\" x2=\"225\" y2=\"115\" stroke=\"#8b76ed\" stroke-width=\"7\"/><line x1=\"150\" y1=\"115\" x2=\"225\" y2=\"115\" stroke=\"#ff8a73\" stroke-width=\"7\"/><circle cx=\"150\" cy=\"115\" r=\"5\" fill=\"#25304b\"/><text x=\"82\" y=\"103\" font-size=\"16\" font-weight=\"800\">A<\/text><text x=\"144\" y=\"139\" font-size=\"16\" font-weight=\"800\">O<\/text><text x=\"230\" y=\"103\" font-size=\"16\" font-weight=\"800\">B<\/text><\/svg><\/div><div><div class=\"diagram-note\" id=\"relationText\">YARIÇAP = 5 cm<br>5 cm + 5 cm = <b>ÇAP: 10 cm<\/b><\/div><div class=\"range-wrap\"><label for=\"rSlider\" style=\"font-size:12px;font-weight:800\">Yarıçapı değiştir<\/label><input id=\"rSlider\" type=\"range\" min=\"2\" max=\"7\" value=\"5\" oninput=\"relation(this.value)\"><span class=\"value-chip\" id=\"rValue\">5 cm<\/span><\/div><p style=\"font-size:12px;color:var(--muted)\">Çap = 2 × yarıçap<\/p><\/div><\/div><div class=\"interactive-prompt\"><h3>Yarıçap 3 cm olursa çap kaç cm olur?<\/h3><div class=\"option-row\"><button class=\"option\" onclick=\"miniChoice(this,false,'relFb')\">3 cm<\/button><button class=\"option\" onclick=\"miniChoice(this,true,'relFb')\">6 cm<\/button><button class=\"option\" onclick=\"miniChoice(this,false,'relFb')\">9 cm<\/button><\/div><div class=\"feedback\" id=\"relFb\"><\/div><\/div>`;\nif(l.kind==='compass')body=`<div class=\"demo-grid\"><div class=\"diagram\"><svg viewBox=\"0 0 300 230\"><circle cx=\"150\" cy=\"120\" r=\"72\" fill=\"none\" stroke=\"#4668ec\" stroke-width=\"5\" stroke-dasharray=\"8 5\"/><path d=\"M150 120 L150 37 M150 120 L214 157 M141 52 L159 52 M204 150 L215 164\" fill=\"none\" stroke=\"#ff8a73\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"150\" cy=\"120\" r=\"6\" fill=\"#25304b\"/><text x=\"134\" y=\"145\" font-size=\"16\" font-weight=\"800\">O<\/text><text x=\"158\" y=\"48\" font-size=\"15\" font-weight=\"800\">r<\/text><\/svg><\/div><div><div class=\"diagram-note\">📐 Pergelin açıklığı = yarıçap<\/div><p style=\"font-size:13px;color:var(--muted);line-height:1.7\">Pergelin sivri ucunu merkezde sabit tut. Kalemli ucunu döndürünce çember çizilir. Pergelin açıklığını artırırsan çember de büyür.<\/p><div class=\"range-wrap\"><input type=\"range\" min=\"1\" max=\"5\" value=\"3\" oninput=\"grow(this.value)\"><span class=\"value-chip\" id=\"growVal\">Yarıçap: 3 cm<\/span><\/div><\/div><\/div>`;\nif(l.kind==='angle')body=`<div class=\"demo-grid\"><div class=\"diagram\"><svg viewBox=\"0 0 300 230\"><circle cx=\"150\" cy=\"115\" r=\"82\" fill=\"none\" stroke=\"#4668ec\" stroke-width=\"4\"/><path d=\"M150 115 L150 33 A82 82 0 0 1 221 74 Z\" fill=\"#ffe7bd\" opacity=\".9\"/><line x1=\"150\" y1=\"115\" x2=\"150\" y2=\"33\" stroke=\"#ff8a73\" stroke-width=\"6\"/><line x1=\"150\" y1=\"115\" x2=\"221\" y2=\"74\" stroke=\"#ff8a73\" stroke-width=\"6\"/><circle cx=\"150\" cy=\"115\" r=\"6\" fill=\"#25304b\"/><text x=\"158\" y=\"111\" font-size=\"16\" font-weight=\"800\">O<\/text><text x=\"166\" y=\"75\" fill=\"#9a7226\" font-size=\"20\" font-weight=\"800\">∠<\/text><\/svg><\/div><div><div class=\"diagram-note\">İki kolu da yarıçap olan açının köşesi merkez O'dadır. Bu açıya <b>merkez açısı<\/b> denir.<\/div><p style=\"font-size:13px;color:var(--muted);line-height:1.6\">Turuncu bölge açıyı gösteriyor. Açının iki kolu çemberin üzerindeki noktalara ulaşır.<\/p><\/div><\/div>`;\nif(l.kind==='identify')body=`<div class=\"demo-grid\"><div class=\"diagram\">${circleSvg(`<line x1=\"150\" y1=\"115\" x2=\"233\" y2=\"115\" stroke=\"#ff8a73\" stroke-width=\"5\"/><circle cx=\"150\" cy=\"115\" r=\"5\" fill=\"#25304b\"/><line x1=\"90\" y1=\"55\" x2=\"210\" y2=\"175\" stroke=\"#8b76ed\" stroke-width=\"5\"/><line x1=\"67\" y1=\"115\" x2=\"233\" y2=\"115\" stroke=\"#75c9a6\" stroke-width=\"5\"/>`)}<\/div><div><div class=\"diagram-note\">🟠 Merkezden çembere = yarıçap<br>🟣 İki ucu çemberde, merkezden geçmiyor = çap değil<br>🟢 İki ucu çemberde, merkezden geçiyor = çap<\/div><\/div><\/div><div class=\"interactive-prompt\"><h3>Merkezden geçen, iki ucu çemberde olan parça hangisi?<\/h3><div class=\"option-row\"><button class=\"option\" onclick=\"miniChoice(this,false,'identifyFb')\">Turuncu<\/button><button class=\"option\" onclick=\"miniChoice(this,false,'identifyFb')\">Mor<\/button><button class=\"option\" onclick=\"miniChoice(this,true,'identifyFb')\">Yeşil<\/button><\/div><div class=\"feedback\" id=\"identifyFb\"><\/div><\/div>`;\nif(l.kind==='review')body=`<div class=\"concept-row\" style=\"grid-template-columns:1fr 1fr\"><div class=\"concept\">⭕ <b>Çember<\/b> sadece sınır çizgisidir.<\/div><div class=\"concept\">🔵 <b>Daire<\/b> çember ve iç bölgesidir.<\/div><div class=\"concept\">📏 <b>Yarıçap<\/b> merkezden çemberin üstüne uzanır.<\/div><div class=\"concept\">↔️ <b>Çap<\/b> merkezden geçen tam bir çizgidir.<\/div><\/div><div class=\"interactive-prompt\"><h3>Doğru mu, yanlış mı? Çap, iki yarıçap uzunluğundadır.<\/h3><div class=\"option-row\"><button class=\"option\" onclick=\"miniChoice(this,true,'reviewFb')\">Doğru ✓<\/button><button class=\"option\" onclick=\"miniChoice(this,false,'reviewFb')\">Yanlış<\/button><\/div><div class=\"feedback\" id=\"reviewFb\"><\/div><\/div>`;\nif(l.kind==='challenge')body=`<div class=\"result-box\"><div class=\"result-star\">🚀<\/div><h2>Hazırsan mini teste geç!<\/h2><p>8 soru seni bekliyor. Bakalım kaçını doğru yapacaksın?<\/p><button class=\"btn primary\" onclick=\"showPage('quiz')\">🎯 Teste başla<\/button><\/div>`;\ndocument.getElementById('lessonContent').innerHTML=`<article class=\"lesson-card\"><span class=\"eyebrow\">ADIM ${String(lessonIndex+1).padStart(2,'0')} / ${lessons.length}<\/span><h2 style=\"margin-top:15px\">${l.title}<\/h2><p>${l.sub}<\/p>${body}<\/article>`}\nfunction miniChoice(btn,correct,id){const box=document.getElementById(id);if(!box)return;box.textContent=correct?'🎉 Doğru! Harika keşfettin.':'Bir daha düşün. İpucuna bakıp tekrar deneyebilirsin.';box.className='feedback '+(correct?'good':'try');btn.classList.add(correct?'correct':'wrong');if(correct)addPoints(1)}function comparePick(el,filled){document.querySelectorAll('.compare-choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');toast(filled?'Bu daire; iç bölgesi de dolu.':'Bu çember, yalnızca dış çizgisi var!')}\nfunction centerPick(ok){const fb=document.getElementById('centerFb');fb.textContent=ok?'🎉 Evet! Burası merkez.':'Tekrar düşün. Merkez çemberin tam ortasındaki noktadır.';fb.className='feedback '+(ok?'good':'try');if(ok)addPoints(1)}function grow(v){const r=20+Number(v)*18;let c=document.getElementById('growCircle'),line=document.getElementById('growRadius'),a=document.getElementById('growA');if(c){c.setAttribute('r',r);line.setAttribute('x2',150+r);a.setAttribute('x',155+r)}const val=document.getElementById('growVal');if(val)val.textContent=`Yarıçap: ${v} cm`}\nfunction relation(v){const n=Number(v);document.getElementById('rValue').textContent=n+' cm';document.getElementById('relationText').innerHTML=`YARIÇAP = ${n} cm<br>${n} cm + ${n} cm = <b>ÇAP: ${n*2} cm<\/b>`}\nlet dragTarget=null;function setupDrag(){const svg=document.getElementById('dragSvg');if(!svg)return;const h1=document.getElementById('handle1'),h2=document.getElementById('handle2');[h1,h2].forEach((h,i)=>{h.addEventListener('pointerdown',e=>{dragTarget=i;svg.setPointerCapture(e.pointerId)});});svg.addEventListener('pointermove',e=>{if(dragTarget===null)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const dx=q.x-150,dy=q.y-115,d=Math.hypot(dx,dy)||1;const x=150+dx/d*83,y=115+dy/d*83;const h=dragTarget===0?h1:h2;h.setAttribute('cx',x);h.setAttribute('cy',y);const l=document.getElementById('dragLine');l.setAttribute(dragTarget===0?'x1':'x2',x);l.setAttribute(dragTarget===0?'y1':'y2',y);checkDrag()});svg.addEventListener('pointerup',()=>dragTarget=null)}\nfunction checkDrag(){const a=document.getElementById('handle1'),b=document.getElementById('handle2');if(!a)return;const dx=+b.getAttribute('cx')-(+a.getAttribute('cx')),dy=+b.getAttribute('cy')-(+a.getAttribute('cy')),mx=(+a.getAttribute('cx')+ +b.getAttribute('cx'))/2,my=(+a.getAttribute('cy')+ +b.getAttribute('cy'))/2;const centered=Math.hypot(mx-150,my-115)<9;const note=document.getElementById('dragNote');note.innerHTML=centered?'🎯 İşte bu çap! Doğru parçası merkez O’dan geçiyor.':'Bu doğru parçası çemberin iki noktasını birleştiriyor ama merkezden geçmediği için çap değil.';note.style.background=centered?'#e5f8ef':'#fff3e3';note.style.color=centered?'#13774e':'#8a6421';document.getElementById('dragLine').setAttribute('stroke',centered?'#41b885':'#ff8a73')}\nfunction resetDrag(){document.getElementById('handle1').setAttribute('cx',82);document.getElementById('handle1').setAttribute('cy',67);document.getElementById('handle2').setAttribute('cx',218);document.getElementById('handle2').setAttribute('cy',163);document.getElementById('dragLine').setAttribute('x1',82);document.getElementById('dragLine').setAttribute('y1',67);document.getElementById('dragLine').setAttribute('x2',218);document.getElementById('dragLine').setAttribute('y2',163);checkDrag()}\nfunction renderQuiz(){if(quizDone&&quizMode==='test'){renderResult();return}const names={test:'📝 Test',tf:'✅ Doğru / Yanlış',match:'🧲 Sürükle & Eşleştir',game:'🎮 Çap Avcısı'};document.getElementById('quizArea').innerHTML=`<div class=\"quiz-mode-tabs\">${Object.entries(names).map(([id,label])=>`<button class=\"${quizMode===id?'active':''}\" onclick=\"setQuizMode('${id}')\">${label}<\/button>`).join('')}<\/div><div id=\"quizModeContent\"><\/div>`;const box=document.getElementById('quizModeContent');if(quizMode==='test')box.innerHTML=renderTest();if(quizMode==='tf')box.innerHTML=renderTrueFalse();if(quizMode==='match')box.innerHTML=renderMatch();if(quizMode==='game')box.innerHTML=renderMiniGame()}\nfunction setQuizMode(mode){quizMode=mode;renderQuiz()}\nfunction renderTest(){const q=qlist[quizIndex];return `<div class=\"quiz-top\"><span>Soru ${quizIndex+1} / ${qlist.length}<\/span><span>⭐ ${quizScore} doğru<\/span><\/div><div class=\"quiz-meter\"><i style=\"width:${quizIndex/qlist.length*100}%\"><\/i><\/div><div class=\"quiz-card\"><h2>${q[0]}<\/h2><div class=\"quiz-options\">${q[1].map((a,i)=>`<button onclick=\"answer(${i},this)\">${String.fromCharCode(65+i)}. ${a}<\/button>`).join('')}<\/div><div class=\"quiz-feedback\" id=\"quizFb\"><\/div><div class=\"quiz-foot\"><span style=\"font-size:12px;color:var(--muted)\">Cevabını seç 👆<\/span><button class=\"btn primary\" id=\"quizNext\" style=\"display:none\" onclick=\"nextQuestion()\">${quizIndex===qlist.length-1?'Sonucu gör →':'Sonraki soru →'}<\/button><\/div><\/div>`}\nfunction renderTrueFalse(){if(tfIndex>=tfQuestions.length)return `<div class=\"result-box\"><div class=\"result-star\">${tfScore>=4?'🌟':'👏'}<\/div><h1>Doğru / yanlış tamamlandı!<\/h1><p>${tfQuestions.length} ifadeden ${tfScore} tanesini bildin.<\/p><button class=\"btn primary\" onclick=\"tfIndex=0;tfScore=0;tfAnswered=false;renderQuiz()\">🔁 Yeniden oyna<\/button><\/div>`;const q=tfQuestions[tfIndex];return `<div class=\"mode-progress\">İfade ${tfIndex+1} / ${tfQuestions.length}　•　⭐ ${tfScore} doğru<\/div><article class=\"tf-card\"><h2>${q[0]}<\/h2><div class=\"tf-buttons\"><button onclick=\"answerTF(true)\">✅ Doğru<\/button><button onclick=\"answerTF(false)\">❌ Yanlış<\/button><\/div><div class=\"tf-feedback\" id=\"tfFeedback\"><\/div><button class=\"btn primary\" id=\"tfNext\" style=\"display:none;margin-top:12px\" onclick=\"nextTF()\">${tfIndex===tfQuestions.length-1?'Sonucu gör →':'Sonraki ifade →'}<\/button><\/article>`}\nfunction answerTF(choice){if(tfAnswered)return;tfAnswered=true;const q=tfQuestions[tfIndex],ok=choice===q[1],fb=document.getElementById('tfFeedback');if(ok){tfScore++;addPoints(1)}fb.textContent=(ok?'🎉 Doğru! ':'Bir daha düşün. ')+q[2];fb.style.color=ok?'#168b5b':'#b56935';document.getElementById('tfNext').style.display='inline-flex'}function nextTF(){tfIndex++;tfAnswered=false;renderQuiz()}\nfunction renderMatch(){if(Object.keys(matchPlaced).length===matchItems.length)return `<div class=\"result-box\"><div class=\"result-star\">🧲<\/div><h1>Eşleştirmeler tamam!<\/h1><p>Harika! Bütün kavramları doğru yerlere yerleştirdin.<\/p><button class=\"btn primary\" onclick=\"matchPlaced={};matchSelected='';renderQuiz()\">🔁 Tekrar oyna<\/button><\/div>`;return `<article class=\"match-card\"><h2>Kavramları doğru açıklamayla eşleştir<\/h2><p style=\"color:var(--muted);font-size:13px\">Bir kavramı sürükleyip açıklamasına bırak. iPad’de kavrama, sonra açıklama kutusuna dokunabilirsin.<\/p><div class=\"match-layout\"><div class=\"term-pool\">${matchItems.filter(([term])=>!matchPlaced[term]).map(([term])=>`<button class=\"term-tile ${matchSelected===term?'selected':''}\" draggable=\"true\" onclick=\"selectTerm('${term}')\" ondragstart=\"event.dataTransfer.setData('text/plain','${term}')\">${term}<\/button>`).join('')}<\/div><div class=\"match-targets\">${matchItems.map(([term,desc])=>`<div class=\"match-zone\" ondragover=\"event.preventDefault();this.classList.add('over')\" ondragleave=\"this.classList.remove('over')\" ondrop=\"event.preventDefault();this.classList.remove('over');placeMatch(event.dataTransfer.getData('text/plain'),'${term}')\" onclick=\"matchSelected&&placeMatch(matchSelected,'${term}')\"><small>${desc}<\/small>${matchPlaced[term]?`<b>✓ ${matchPlaced[term]}<\/b>`:''}<\/div>`).join('')}<\/div><\/div><div class=\"match-feedback\" id=\"matchFeedback\">${matchSelected?`“${matchSelected}” seçildi — uygun açıklamaya dokun.`:'Bir kavram seçerek başla.'}<\/div><\/article>`}\nfunction selectTerm(term){if(matchPlaced[term])return;matchSelected=term;renderQuiz()}function placeMatch(term,target){if(!term||matchPlaced[term])return;if(term===target){matchPlaced[target]=term;matchSelected='';addPoints(2);toast('🎉 Harika eşleştirme!')}else{matchSelected=term;toast('Bir daha düşün; ipuçlarını oku.')}renderQuiz()}\nfunction renderMiniGame(){if(miniRound>=5)return `<div class=\"result-box\"><div class=\"result-star\">🏁<\/div><h1>Çap avcısı tamamlandı!<\/h1><p>5 turdan ${miniScore} tanesinde çapı buldun.<\/p><button class=\"btn primary\" onclick=\"miniRound=0;miniScore=0;miniAnswered=false;renderQuiz()\">🔁 Yeniden oyna<\/button><\/div>`;const target=(miniRound+1)%3;return `<div class=\"mode-progress\">Tur ${miniRound+1} / 5　•　⭐ ${miniScore} doğru<\/div><article class=\"game-card\"><h2>🔎 Hangisinde doğru parçası merkezden geçiyor?<\/h2><div class=\"mini-options\">${[0,1,2].map(i=>`<button class=\"mini-choice\" onclick=\"pickDiameter(${i},${target})\"><svg viewBox=\"0 0 140 140\" aria-label=\"Çember ve doğru parçası\"><circle cx=\"70\" cy=\"70\" r=\"48\" fill=\"#f7f8ff\" stroke=\"#4668ec\" stroke-width=\"4\"/><line x1=\"${i===target?'22':'25'}\" y1=\"${i===target?'70':'54'}\" x2=\"${i===target?'118':'107'}\" y2=\"${i===target?'70':'39'}\" stroke=\"#ff8a73\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"70\" r=\"4\" fill=\"#25304b\"/><\/svg><span>${String.fromCharCode(65+i)} seçeneği<\/span><\/button>`).join('')}<\/div><div class=\"game-feedback\" id=\"gameFeedback\"><\/div><button class=\"btn primary\" id=\"gameNext\" style=\"display:none;margin-top:12px\" onclick=\"nextGameRound()\">${miniRound===4?'Sonucu gör →':'Sonraki tur →'}<\/button><\/article>`}\nfunction pickDiameter(choice,target){if(miniAnswered)return;miniAnswered=true;const ok=choice===target,fb=document.getElementById('gameFeedback'),buttons=document.querySelectorAll('.mini-choice');buttons[target].classList.add('correct');if(ok){miniScore++;addPoints(2);fb.textContent='🎯 Evet! İki uç çemberde ve parça merkezden geçiyor.';fb.style.color='#168b5b'}else{buttons[choice].classList.add('wrong');fb.textContent='Merkezi kesen çizgiyi bul. Doğru parçası merkezden geçer.';fb.style.color='#b56935'}document.getElementById('gameNext').style.display='inline-flex'}function nextGameRound(){miniRound++;miniAnswered=false;renderQuiz()}\nfunction answer(i,btn){if(answered)return;answered=true;const q=qlist[quizIndex],all=document.querySelectorAll('.quiz-options button');all[q[2]].classList.add('correct');const fb=document.getElementById('quizFb');if(i===q[2]){quizScore++;addPoints(2);fb.textContent='🎉 '+q[3];fb.style.color='#168b5b'}else{btn.classList.add('wrong');fb.textContent='Canın sağ olsun! '+q[3];fb.style.color='#b56935'}document.getElementById('quizNext').style.display='inline-flex';document.querySelector('.quiz-meter i').style.width=`${(quizIndex+1)/qlist.length*100}%`}\nfunction nextQuestion(){if(quizIndex<qlist.length-1){quizIndex++;answered=false;renderQuiz()}else{quizDone=true;renderResult();showPage('result')}}function resetQuiz(){quizIndex=0;quizScore=0;answered=false;quizDone=false;renderQuiz()}function renderResult(){const area=document.getElementById('resultArea');if(!quizDone){area.innerHTML=`<div class=\"result-box\"><div class=\"result-star\">🌱<\/div><h1>Hazırsan başlayalım!<\/h1><p>Mini testi tamamladığında sonuçların burada görünecek.<\/p><button class=\"btn primary\" onclick=\"showPage('quiz')\">🎯 Soru çöz<\/button><\/div>`;return}const pct=Math.round(quizScore/qlist.length*100),msg=pct===100?'Muhteşem! Çember konusunda harikasın!':pct>=60?'Çok iyi gidiyorsun! Birkaç tekrar ile daha da güçlenirsin.':'Güzel bir başlangıç! Konu kartlarına dönüp yeniden deneyebilirsin.';area.innerHTML=`<div class=\"result-box\"><div class=\"result-star\">${pct>=75?'🏆':'🌟'}<\/div><h1>${pct>=75?'Harika iş çıkardın!':'Testi tamamladın!'}<\/h1><p>${msg}<\/p><div class=\"score-circle\">${quizScore}/${qlist.length}<\/div><div class=\"result-list\"><span>Doğru: <b>${quizScore}<\/b><\/span><span>Yanlış: <b>${qlist.length-quizScore}<\/b><\/span><span>Başarı: <b>%${pct}<\/b><\/span><\/div><button class=\"btn secondary\" onclick=\"resetQuiz();showPage('quiz')\">🔁 Yeniden dene<\/button><\/div>`}\nfunction addPoints(n){points+=n;document.getElementById('points').textContent=points}let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}\nconst oldRender=renderLesson;renderLesson=function(){oldRender();setupDrag()};renderLesson();renderQuiz();\ndocument.getElementById('nextLesson').addEventListener('click',()=>{if(lessonIndex===lessons.length-1)showPage('quiz')});\n<\/script><\/body><\/html>\n"};
</script></body></html>
